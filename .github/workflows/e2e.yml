name: E2E Smoke

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"
      NODE_VERSION: "20"
      BUN_VERSION: "1.3.6"
      EVIDENCE_DIR: storage/review-evidence

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: paspapan_e2e
          MYSQL_USER: paspapan
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=paspapan_e2e
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Prepare app
        run: |
          php artisan key:generate --force
          chmod -R ug+rwx storage bootstrap/cache
          php artisan migrate --force
          php scripts/prepare-apk-screenshots-demo.php
          bun run build

      - name: Start Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &

      - name: Wait for Laravel
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Run Playwright smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_ADMIN_EMAIL: apk.demo.superadmin@paspapan.test
          E2E_ADMIN_PASSWORD: "12345678"
          E2E_USER_EMAIL: apk.demo.user@paspapan.test
          E2E_USER_PASSWORD: "12345678"
        run: |
          set -o pipefail
          bun run e2e:smoke 2>&1 | tee "${EVIDENCE_DIR}/playwright-smoke.log"

      - name: Summarize Playwright evidence
        if: always()
        run: |
          {
            echo "## Playwright Smoke Evidence"
            echo
            echo "- Log: playwright-smoke.log"
            echo "- Report: playwright-report artifact"
            echo "- Test results: test-results artifact"
          } | tee "${EVIDENCE_DIR}/playwright-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-playwright
          path: |
            storage/review-evidence
            test-results
          if-no-files-found: ignore
