name: Coverage Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "31 19 * * 2"

jobs:
  coverage:
    name: Pest coverage summary
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: paspapan_coverage
          MYSQL_USER: paspapan
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pcov, pdo_mysql, zip
          coverage: pcov
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=paspapan_coverage
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate key and migrate
        run: |
          php artisan key:generate --force
          php artisan migrate --force

      - name: Run coverage summary
        env:
          XDEBUG_MODE: coverage
        run: php artisan test --without-tty --coverage --min=0
