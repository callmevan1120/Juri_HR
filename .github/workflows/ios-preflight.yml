name: iOS Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'capacitor-www/**'
      - 'ios/**'
      - 'resources/js/**'
      - 'resources/css/**'
      - 'scripts/ios-release-preflight.sh'
      - '.github/workflows/ios-preflight.yml'

jobs:
  ios-preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v3
        with:
          bun-version: '1.3.6'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Run iOS preflight
        run: bun run ios:preflight
