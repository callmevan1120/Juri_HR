name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    name: Quality and Tests
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"
      NODE_VERSION: "20"
      BUN_VERSION: "1.3.6"
      EVIDENCE_DIR: storage/review-evidence

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: paspapan_ci
          MYSQL_USER: paspapan
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=paspapan_ci
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Ensure writable directories
        run: chmod -R ug+rwx storage bootstrap/cache

      - name: Run database migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paspapan_ci
          DB_USERNAME: paspapan
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paspapan_ci
          DB_USERNAME: paspapan
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
        run: |
          set -o pipefail
          php artisan test --without-tty 2>&1 | tee "${EVIDENCE_DIR}/php-artisan-test.log"

      - name: UI Rules Check
        run: |
          set -o pipefail
          composer check:ui 2>&1 | tee "${EVIDENCE_DIR}/composer-check-ui.log"

      - name: Enterprise boundary check
        run: |
          set -o pipefail
          composer check:enterprise-boundary 2>&1 | tee "${EVIDENCE_DIR}/composer-check-enterprise-boundary.log"

      - name: Modern stack check
        run: |
          set -o pipefail
          composer check:modern-stack 2>&1 | tee "${EVIDENCE_DIR}/composer-check-modern-stack.log"

      - name: Pint
        run: |
          set -o pipefail
          ./vendor/bin/pint --test 2>&1 | tee "${EVIDENCE_DIR}/pint-test.log"

      - name: PHPStan
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paspapan_ci
          DB_USERNAME: paspapan
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          set -o pipefail
          composer phpstan 2>&1 | tee "${EVIDENCE_DIR}/composer-phpstan.log"

      - name: Composer audit
        run: |
          set -o pipefail
          composer audit 2>&1 | tee "${EVIDENCE_DIR}/composer-audit.log"

      - name: Bun audit
        run: |
          set -o pipefail
          bun audit 2>&1 | tee "${EVIDENCE_DIR}/bun-audit.log"

      - name: RBAC audit
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: paspapan_ci
          DB_USERNAME: paspapan
          DB_PASSWORD: secret
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          set -o pipefail
          php artisan rbac:audit 2>&1 | tee "${EVIDENCE_DIR}/php-artisan-rbac-audit.log"

      - name: Build frontend assets
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "${EVIDENCE_DIR}/bun-run-build.log"

      - name: Summarize review evidence
        if: always()
        run: |
          {
            echo "## PasPapan Review Evidence"
            echo
            echo "| Gate | Log |"
            echo "| --- | --- |"
            echo "| PHP tests | php-artisan-test.log |"
            echo "| PHPStan | composer-phpstan.log |"
            echo "| Pint | pint-test.log |"
            echo "| Composer audit | composer-audit.log |"
            echo "| Bun audit | bun-audit.log |"
            echo "| Frontend build | bun-run-build.log |"
            echo "| RBAC audit | php-artisan-rbac-audit.log |"
            echo "| UI rules | composer-check-ui.log |"
            echo "| Modern stack | composer-check-modern-stack.log |"
            echo "| Enterprise boundary | composer-check-enterprise-boundary.log |"
            echo
            echo "Runtime baseline: PHP ${PHP_VERSION}, Node ${NODE_VERSION}+ compatible, Bun ${BUN_VERSION}."
          } | tee "${EVIDENCE_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload review evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-ci
          path: storage/review-evidence
          if-no-files-found: warn
