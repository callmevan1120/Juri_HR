name: APK Smoke Evidence

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Android package name to launch"
        required: false
        default: "com.pandanteknik.paspapan.debug"
      activity_name:
        description: "Android activity name to launch"
        required: false
        default: "com.pandanteknik.paspapan.debug/com.pandanteknik.paspapan.MainActivity"

jobs:
  apk-smoke:
    name: APK device smoke
    runs-on: [self-hosted, android, adb]
    timeout-minutes: 45
    env:
      NODE_VERSION: "20"
      BUN_VERSION: "1.3.6"
      EVIDENCE_DIR: storage/review-evidence
      PACKAGE_NAME: ${{ inputs.package_name }}
      ACTIVITY_NAME: ${{ inputs.activity_name }}
      APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
      SCREENSHOT_PATH: storage/review-evidence/apk-device-smoke.png

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets for Android
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Run APK smoke
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          set -o pipefail
          bash scripts/apk-device-smoke.sh 2>&1 | tee "${EVIDENCE_DIR}/apk-smoke.log"

      - name: Summarize APK smoke evidence
        if: always()
        run: |
          {
            echo "## APK Smoke Evidence"
            echo
            echo "- Log: apk-smoke.log"
            echo "- Screenshot: apk-device-smoke.png"
            echo "- Requires a self-hosted runner labelled: self-hosted, android, adb"
            echo "- Runtime baseline: Node ${NODE_VERSION}, Bun ${BUN_VERSION}, Java 21"
          } | tee "${EVIDENCE_DIR}/apk-smoke-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload APK smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-apk-smoke
          path: storage/review-evidence
          if-no-files-found: warn
