name: Database Portability

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  postgres:
    name: PostgreSQL migration smoke
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paspapan_pg_ci
          POSTGRES_USER: paspapan
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paspapan -d paspapan_pg_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare PostgreSQL environment
        run: |
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=paspapan_pg_ci
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          DB_SCHEMA=public
          DB_SSLMODE=prefer
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run static portability guard
        run: composer check:database-portability

      - name: Run PostgreSQL migrations
        run: php artisan migrate --force

      - name: Run focused PostgreSQL smoke tests
        run: php artisan test tests/Feature/HealthEndpointTest.php tests/Feature/WilayahApiHardeningTest.php tests/Feature/AuthenticationTest.php

  sqlite:
    name: SQLite migration smoke
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"
      SQLITE_DATABASE: /tmp/paspapan_sqlite_ci.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare SQLite environment
        run: |
          cp .env.example .env
          touch "${SQLITE_DATABASE}"
          cat <<EOF >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1
          DB_CONNECTION=sqlite
          DB_DATABASE=${SQLITE_DATABASE}
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run SQLite migrations
        run: php artisan migrate --force

      - name: Run focused SQLite smoke tests
        run: php artisan test tests/Feature/HealthEndpointTest.php

  mysql:
    name: MySQL compatibility smoke
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: "8.3"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: paspapan_mysql_ci
          MYSQL_USER: paspapan
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upaspapan -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare MySQL compatibility environment
        run: |
          cp .env.example .env
          cat <<'EOF' >> .env
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=paspapan_mysql_ci
          DB_USERNAME=paspapan
          DB_PASSWORD=secret
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          MAIL_MAILER=array
          BROADCAST_CONNECTION=log
          EOF

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run MySQL compatibility migrations
        run: php artisan migrate --force

      - name: Run focused MySQL compatibility smoke tests
        run: php artisan test tests/Feature/HealthEndpointTest.php tests/Feature/WilayahApiHardeningTest.php tests/Feature/AuthenticationTest.php
