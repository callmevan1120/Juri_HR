name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the app
        run: python -m compileall -q frappe/juri_hr

      # The MVP only adds Python tests at three risky spots (work-hours resolver,
      # payslip parser, payslip access control). Until they exist this step is a no-op.
      - name: Unit tests
        run: |
          tests=$(find frappe/juri_hr -name 'test_*.py' -print -quit)
          if [ -n "$tests" ]; then
            pip install pytest
            pytest frappe/juri_hr
          else
            echo "No Python tests yet — skipping."
          fi
