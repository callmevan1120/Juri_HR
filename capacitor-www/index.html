<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0b1220">
        <title>PasPapan</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #07110c;
                --surface: rgba(15, 23, 42, 0.92);
                --border: rgba(148, 163, 184, 0.2);
                --text: #f8fafc;
                --muted: #cbd5e1;
                --primary: #84c178;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                color: var(--text);
                background:
                    radial-gradient(circle at top, rgba(132, 193, 120, 0.18), transparent 34%),
                    var(--bg);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            main {
                width: min(100%, 420px);
                padding: 24px;
                border: 1px solid var(--border);
                border-radius: 28px;
                background: var(--surface);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
            }

            .mark {
                width: 56px;
                height: 56px;
                display: grid;
                place-items: center;
                border-radius: 18px;
                background: rgba(132, 193, 120, 0.16);
                color: var(--primary);
                font-size: 28px;
                font-weight: 800;
            }

            h1 {
                margin: 20px 0 8px;
                font-size: 28px;
                line-height: 1.15;
            }

            p {
                margin: 0;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.65;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark">P</div>
            <h1>PasPapan siap dibuka.</h1>
            <p>Shell mobile akan memuat server PasPapan yang dikonfigurasi. Pastikan koneksi dan URL environment aktif.</p>
        </main>
    </body>
</html>
