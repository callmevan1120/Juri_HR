<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuriHR — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f9fafb;
        color: #111827;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #6b7280;
        font-size: 0.875rem;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 1rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #030712;
          color: #f3f4f6;
        }
        p {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" alt="JuriHR" />
      <h1>Tidak ada koneksi</h1>
      <p>Periksa jaringan Anda, lalu coba lagi.</p>
    </main>
  </body>
</html>
